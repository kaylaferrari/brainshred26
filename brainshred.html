<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>BRAINSTOCK '26</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#060916;color:#F5F0E8;font-family:'DM Mono',monospace;touch-action:manipulation;}
button{touch-action:manipulation;cursor:pointer;}
:root{--night:#060916;--navy:#0C1428;--lime:#C8F500;--coral:#FF4D6D;--cyan:#00F0FF;--gold:#FFB800;--purple:#BF5FFF;--cream:#F5F0E8;--muted:rgba(245,240,232,.45);--g0:#C8F500;--g1:#FF4D6D;--g2:#FFB800;--g3:#00F0FF;--g4:#FF6B35;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden;background:var(--night);}
.screen.active{display:flex;}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.fest{font-family:'Bebas Neue',sans-serif;letter-spacing:.04em;}
.mono{font-family:'DM Mono',monospace;}
body.landscape{}
#canvas{position:absolute;top:0;left:0;z-index:1;}

/* ------------------ UI LAYER ------------------ */
#ui{position:absolute;inset:0;z-index:10;pointer-events:none;}
#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;}
.hud-left{display:flex;flex-direction:column;gap:4px;min-width:0px;}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
#zone-label{font-family:'Bebas Neue',sans-serif;font-size:clamp(14px,3.5vw,22px);letter-spacing:.06em;color:var(--lime);text-shadow:0 2px 8px rgba(200,245,0,.5);}
#score-dis{font-family:'Bebas Neue',sans-serif;font-size:clamp(12px,3.5vw,20px);color:var(--cream);opacity:.7;letter-spacing:.04em;}
#score-live{display:flex;gap:4px;align-items:center;}
.score-item{font-family:'Bebas Neue';font-size:clamp(18px,5vw,36px);line-height:1;}
.score-item.highlight{color:var(--lime);text-shadow:0 0 12px var(--lime);}
.score-separator{font-family:'Bebas Neue';font-size:clamp(18px,5vw,36px);line-height:1;opacity:.4;}
#combo-bar-wrap{width:clamp(80px,20vw,140px);}
#combo-label{font-size:clamp(9px,2.2vw,12px);opacity:.6;letter-spacing:.06em;margin-bottom:2px;}
#combo-bar-bg{height:4px;background:rgba(245,240,232,.15);border-radius:2px;overflow:hidden;}
#combo-bar-fill{height:100%;width:0%;background:var(--lime);border-radius:2px;transition:width .1s,background .2s;}
#mini-map{width:clamp(56px,14vw,80px);height:clamp(56px,14vw,80px);border:1px solid rgba(245,240,232,.2);border-radius:4px;overflow:hidden;background:rgba(6,9,22,.7);flex-shrink:0;}

/* Joystick */
#joystick-zone{position:absolute;bottom:0;left:0;width:50%;height:45%;pointer-events:auto;touch-action:none;}
#joystick-base{position:absolute;width:clamp(80px,18vw,110px);height:clamp(80px,18vw,110px);border-radius:50%;background:rgba(245,240,232,.08);border:2px solid rgba(245,240,232,.2);display:none;transform:translate(-50%,-50%);pointer-events:none;}
#joystick-stick{position:absolute;width:clamp(32px,8vw,46px);height:clamp(32px,8vw,46px);border-radius:50%;background:rgba(200,245,0,.5);border:2px solid var(--lime);display:none;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 12px rgba(200,245,0,.4);}

/* Action buttons */
#action-btns{position:absolute;bottom:clamp(16px,4vw,28px);right:clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:clamp(8px,2vw,14px);pointer-events:auto;}
.act-btn{width:clamp(48px,12vw,64px);height:clamp(48px,12vw,64px);border-radius:50%;border:2px solid;font-family:'Bebas Neue',sans-serif;font-size:clamp(10px,2.5vw,14px);letter-spacing:.04em;background:rgba(6,9,22,.7);display:flex;align-items:center;justify-content:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
#btn-boost{border-color:var(--lime);color:var(--lime);box-shadow:0 0 12px rgba(200,245,0,.3);}
#btn-boost.active{background:rgba(200,245,0,.25);}
#btn-sample{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 12px rgba(0,240,255,.3);}
#btn-sample.active{background:rgba(0,240,255,.25);}

/* Zone flash */
#zone-flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;z-index:5;}

/* Narrative overlay */
#narrative{position:absolute;bottom:clamp(70px,18vw,120px);left:50%;transform:translateX(-50%);background:rgba(6,9,22,.88);border:1px solid rgba(245,240,232,.2);border-radius:8px;padding:clamp(10px,2.5vw,16px) clamp(14px,3.5vw,22px);max-width:min(340px,85vw);width:max-content;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s;z-index:20;}
#narrative-text{font-size:clamp(11px,2.8vw,14px);line-height:1.5;color:var(--cream);}
#narrative-sub{font-size:clamp(9px,2.2vw,11px);opacity:.55;margin-top:4px;letter-spacing:.05em;}

/* Pause btn */
#btn-pause{position:absolute;top:clamp(10px,2.5vw,14px);right:clamp(10px,2.5vw,14px);width:clamp(32px,8vw,40px);height:clamp(32px,8vw,40px);border-radius:50%;background:rgba(6,9,22,.6);border:1px solid rgba(245,240,232,.25);color:var(--cream);font-size:clamp(12px,3vw,16px);display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:30;touch-action:manipulation;}

/* Screens */
#screen-boot{background:var(--night);align-items:center;justify-content:center;}
.boot-inner{display:flex;flex-direction:column;align-items:center;gap:clamp(16px,4vw,28px);padding:clamp(24px,6vw,48px) clamp(20px,5vw,40px);text-align:center;max-width:480px;width:100%;}
.boot-logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(44px,13vw,96px);letter-spacing:.06em;line-height:.9;}
.boot-logo .yr{font-size:clamp(22px,6vw,48px);color:var(--lime);display:block;}
.boot-tagline{font-size:clamp(10px,2.5vw,13px);letter-spacing:.14em;opacity:.55;text-transform:uppercase;}
.boot-btn{font-family:'Bebas Neue',sans-serif;font-size:clamp(16px,4.5vw,22px);letter-spacing:.1em;padding:clamp(12px,3vw,16px) clamp(32px,8vw,48px);border-radius:4px;border:none;cursor:pointer;touch-action:manipulation;}
.boot-btn.primary{background:var(--lime);color:var(--night);}
.boot-btn.secondary{background:transparent;border:2px solid rgba(245,240,232,.3);color:var(--cream);}
.boot-stats{display:flex;gap:clamp(16px,4vw,32px);justify-content:center;}
.boot-stat{display:flex;flex-direction:column;align-items:center;gap:4px;}
.boot-stat-val{font-family:'Bebas Neue';font-size:clamp(22px,6vw,36px);color:var(--lime);}
.boot-stat-lbl{font-size:clamp(9px,2.2vw,11px);opacity:.5;letter-spacing:.08em;}

#screen-pause,#screen-over,#screen-board{background:rgba(6,9,22,.96);align-items:center;justify-content:center;}
.panel{display:flex;flex-direction:column;align-items:center;gap:clamp(12px,3vw,20px);padding:clamp(20px,5vw,36px) clamp(20px,5vw,40px);text-align:center;max-width:420px;width:90%;}
.panel-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,8vw,56px);letter-spacing:.06em;}
.panel-sub{font-size:clamp(10px,2.5vw,13px);opacity:.55;letter-spacing:.08em;}
.score-big{font-family:'Bebas Neue',sans-serif;font-size:clamp(48px,14vw,88px);color:var(--lime);line-height:1;}
.score-detail{display:flex;flex-direction:column;gap:6px;width:100%;}
.score-row{display:flex;justify-content:space-between;font-size:clamp(10px,2.5vw,13px);opacity:.7;padding:0 8px;}
.btn-row{display:flex;gap:clamp(8px,2vw,14px);flex-wrap:wrap;justify-content:center;}
.btn{font-family:'Bebas Neue',sans-serif;font-size:clamp(14px,3.5vw,18px);letter-spacing:.08em;padding:clamp(10px,2.5vw,14px) clamp(20px,5vw,32px);border-radius:4px;border:none;cursor:pointer;touch-action:manipulation;}
.btn.primary{background:var(--lime);color:var(--night);}
.btn.secondary{background:transparent;border:2px solid rgba(245,240,232,.3);color:var(--cream);}
.btn.danger{background:var(--coral);color:var(--night);}

/* Leaderboard */
#board-list{width:100%;display:flex;flex-direction:column;gap:6px;max-height:38vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.board-row{display:flex;gap:8px;align-items:center;padding:6px 10px;border-radius:4px;background:rgba(245,240,232,.04);font-size:clamp(10px,2.5vw,13px);}
.board-rank{width:24px;font-family:'Bebas Neue';font-size:clamp(14px,3.5vw,18px);color:var(--lime);text-align:center;}
.board-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.board-score{font-family:'Bebas Neue';font-size:clamp(14px,3.5vw,18px);}
.board-row.me{background:rgba(200,245,0,.1);border:1px solid rgba(200,245,0,.25);}

/* Name entry */
#name-wrap{display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;}
#name-input{background:rgba(245,240,232,.06);border:1px solid rgba(245,240,232,.25);border-radius:4px;padding:clamp(8px,2vw,12px) clamp(12px,3vw,16px);color:var(--cream);font-family:'DM Mono',monospace;font-size:clamp(14px,3.5vw,18px);text-align:center;width:100%;max-width:260px;outline:none;-webkit-appearance:none;}
#name-input:focus{border-color:var(--lime);}

/* Toast */
#toast{position:absolute;bottom:clamp(90px,22vw,130px);left:50%;transform:translateX(-50%);background:rgba(6,9,22,.9);border:1px solid rgba(245,240,232,.2);border-radius:6px;padding:8px 18px;font-size:clamp(11px,2.8vw,13px);letter-spacing:.05em;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .3s;z-index:50;}

/* Loading */
#loading-bar-wrap{width:min(260px,70vw);height:4px;background:rgba(245,240,232,.1);border-radius:2px;overflow:hidden;}
#loading-bar{height:100%;width:0%;background:var(--lime);border-radius:2px;transition:width .2s;}

</style>
</head>
<body>

<!-- BOOT -->
<div id="screen-boot" class="screen active">
  <div class="boot-inner">
    <div class="boot-logo fest">BRAIN<br>SHRED<span class="yr">'26</span></div>
    <div class="boot-tagline">Shred the grid. Own the floor.</div>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
    <div class="boot-stats">
      <div class="boot-stat"><span class="boot-stat-val" id="boot-hs">–</span><span class="boot-stat-lbl">BEST</span></div>
      <div class="boot-stat"><span class="boot-stat-val" id="boot-plays">–</span><span class="boot-stat-lbl">PLAYS</span></div>
      <div class="boot-stat"><span class="boot-stat-val" id="boot-rank">–</span><span class="boot-stat-lbl">RANK</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;width:100%;align-items:center;">
      <button class="boot-btn primary" id="btn-play">TAP TO PLAY</button>
      <button class="boot-btn secondary" id="btn-board-boot">LEADERBOARD</button>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="screen-game" class="screen">
  <canvas id="canvas"></canvas>
  <div id="ui">
    <div id="hud">
      <div class="hud-left">
        <span id="zone-label" class="fest">ZONE 1</span>
        <span id="score-dis" class="fest">DIS 0m</span>
        <div id="score-live">
          <span class="score-item highlight" id="score-pts">0</span>
          <span class="score-separator">·</span>
          <span class="score-item" id="score-combo">x1</span>
        </div>
        <div id="combo-bar-wrap">
          <div id="combo-label" class="mono">COMBO</div>
          <div id="combo-bar-bg"><div id="combo-bar-fill"></div></div>
        </div>
      </div>
      <div class="hud-right">
        <canvas id="mini-map"></canvas>
      </div>
    </div>
    <button id="btn-pause">⏸</button>
    <div id="joystick-zone">
      <div id="joystick-base"></div>
      <div id="joystick-stick"></div>
    </div>
    <div id="action-btns">
      <button class="act-btn" id="btn-boost">BOOST</button>
      <button class="act-btn" id="btn-sample">SYNC</button>
    </div>
    <div id="zone-flash"></div>
    <div id="narrative"><div id="narrative-text"></div><div id="narrative-sub"></div></div>
    <div id="toast"></div>
  </div>
</div>

<!-- PAUSE -->
<div id="screen-pause" class="screen">
  <div class="panel">
    <div class="panel-title fest">PAUSED</div>
    <div class="panel-sub">BRAINSHRED '26</div>
    <div class="btn-row">
      <button class="btn primary" id="btn-resume">RESUME</button>
      <button class="btn secondary" id="btn-quit">QUIT</button>
    </div>
  </div>
</div>

<!-- GAME OVER -->
<div id="screen-over" class="screen">
  <div class="panel">
    <div class="panel-title fest">GAME OVER</div>
    <div class="score-big" id="over-score">0</div>
    <div class="score-detail">
      <div class="score-row"><span>DISTANCE</span><span id="over-dis">0m</span></div>
      <div class="score-row"><span>MAX COMBO</span><span id="over-combo">x1</span></div>
      <div class="score-row"><span>ZONES CLEARED</span><span id="over-zones">0</span></div>
    </div>
    <div id="name-wrap">
      <input id="name-input" maxlength="16" placeholder="YOUR NAME" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false"/>
      <button class="btn primary" id="btn-submit">SUBMIT SCORE</button>
    </div>
    <div class="btn-row">
      <button class="btn secondary" id="btn-retry">PLAY AGAIN</button>
      <button class="btn secondary" id="btn-board-over">LEADERBOARD</button>
    </div>
  </div>
</div>

<!-- LEADERBOARD -->
<div id="screen-board" class="screen">
  <div class="panel">
    <div class="panel-title fest">TOP SHREDDERS</div>
    <div id="board-list"></div>
    <div class="btn-row">
      <button class="btn primary" id="btn-play-board">PLAY</button>
      <button class="btn secondary" id="btn-back-board">BACK</button>
    </div>
  </div>
</div>

<script>
(()=>{
// ─── SUPABASE ────────────────────────────────────────────────────────────────
const SB_URL='https://hhfkdpwvpfxlroqtrqch.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhoZmtkcHd2cGZ4bHJvcXRycWNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDczMjA3NDEsImV4cCI6MjA2Mjg5Njc0MX0.9FHiPJ0jdXBjPbMbFMbFtNIgLg8tHPRpEVCzG3y0iac';
const sb=supabase.createClient(SB_URL,SB_KEY);

// ─── STATE ───────────────────────────────────────────────────────────────────
let W=window.innerWidth,H=window.innerHeight;
let renderer,scene,camera,animId;
let running=false,paused=false;
let score=0,combo=1,comboTimer=0,maxCombo=1;
let distance=0,zonesCleared=0;
let sessionBest=0,localName=localStorage.getItem('bs26_name')||'';
let audioCtx=null,audioUnlocked=false;

// Input
const keys={};
let joyActive=false,joyStartX=0,joyStartY=0,joyDX=0,joyDY=0;
let boostHeld=false,sampleHeld=false;

// Game objects
let player,playerVel={x:0,z:0};
let obstacles=[],collectibles=[],particles=[];
let groundTiles=[],miniCtx;
let zoneProgress=0,currentZone=0;
let frameCount=0,spawnTimer=0;
let boostCooldown=0,sampleCooldown=0;
let invincible=0;

// Zone definitions — renamed for BrainShred theme
const ZONES=[
  {name:'MAINSTAGE',color:0xC8F500,fog:0x060916,speed:8,spawnRate:.018},
  {name:'SPEAKER STACK',color:0xFF4D6D,fog:0x1a0608,speed:11,spawnRate:.022},
  {name:'MOSH PIT',color:0x00F0FF,fog:0x00101a,speed:14,spawnRate:.027},
  {name:'VIP DECK',color:0xFFB800,fog:0x1a1000,speed:17,spawnRate:.032},
  {name:'HEADLINE DROP',color:0xBF5FFF,fog:0x0d0018,speed:20,spawnRate:.036},
];

// Narrative lines per zone
const NARRATIVES=[
  ["The crowd surges forward.","Don't lose the beat.","Sync or get washed."],
  ["Bass walls closing in.","Stack the combo.","Speakers don't care."],
  ["Floor's gone liquid.","Pure instinct now.","Ride the pit."],
  ["Velvet ropes? Shredded.","You own this deck.","Keep the streak alive."],
  ["Everything drops here.","One shot. Big score.","This is the headline."],
];

// ─── AUDIO ───────────────────────────────────────────────────────────────────
function unlockAudio(){
  if(audioUnlocked)return;
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    audioUnlocked=true;
  }catch(e){}
}
function beep(freq=440,dur=0.08,vol=0.18,type='square',detune=0){
  if(!audioUnlocked||!audioCtx)return;
  try{
    const g=audioCtx.createGain();
    const o=audioCtx.createOscillator();
    o.type=type;o.frequency.value=freq;o.detune.value=detune;
    g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function sfxCollect(){beep(880,.06,.15,'sine');beep(1100,.06,.1,'sine',200);}
function sfxHit(){beep(120,.18,.25,'sawtooth');}
function sfxBoost(){beep(440,.04,.12,'square');beep(660,.08,.1,'square',100);}
function sfxZone(){beep(523,.1,.2,'sine');beep(659,.1,.15,'sine');beep(784,.15,.18,'sine');}

// ─── THREE SETUP ─────────────────────────────────────────────────────────────
function initThree(){
  renderer=new THREE.WebGLRenderer({canvas:document.getElementById('canvas'),antialias:false,powerPreference:'low-power'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(W,H);
  renderer.shadowMap.enabled=false;

  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(ZONES[0].fog,.045);

  camera=new THREE.PerspectiveCamera(60,W/H,.1,300);
  camera.position.set(0,5,-10);
  camera.lookAt(0,0,20);

  // Lights
  const amb=new THREE.AmbientLight(0xffffff,.4);
  scene.add(amb);
  const dir=new THREE.DirectionalLight(0xffffff,.8);
  dir.position.set(5,12,8);
  scene.add(dir);

  // Ground tiles
  for(let i=0;i<20;i++){
    const g=new THREE.Mesh(
      new THREE.PlaneGeometry(20,20),
      new THREE.MeshLambertMaterial({color:0x0C1428,wireframe:false})
    );
    g.rotation.x=-Math.PI/2;
    g.position.set(0,-.5,i*20);
    scene.add(g);
    groundTiles.push(g);
  }

  // Grid lines
  const gridMat=new THREE.LineBasicMaterial({color:0x1a2a4a,opacity:.5,transparent:true});
  for(let x=-10;x<=10;x+=2){
    const pts=[new THREE.Vector3(x,-.49,0),new THREE.Vector3(x,-.49,400)];
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),gridMat));
  }

  // Player
  const pGeo=new THREE.BoxGeometry(1,1,1.6);
  const pMat=new THREE.MeshLambertMaterial({color:0xC8F500});
  player=new THREE.Mesh(pGeo,pMat);
  player.position.set(0,.5,0);
  scene.add(player);

  // Mini-map
  const mc=document.getElementById('mini-map');
  const mmSize=mc.getBoundingClientRect();
  mc.width=mmSize.width||72;mc.height=mmSize.height||72;
  miniCtx=mc.getContext('2d');
}

// ─── SPAWN ───────────────────────────────────────────────────────────────────
const LANE_XS=[-6,-3,0,3,6];
function spawnObstacle(){
  const z=ZONE();
  const geo=new THREE.BoxGeometry(2,2,2);
  const mat=new THREE.MeshLambertMaterial({color:0xFF4D6D});
  const m=new THREE.Mesh(geo,mat);
  m.position.set(LANE_XS[Math.floor(Math.random()*5)],.5,player.position.z+120+Math.random()*40);
  scene.add(m);
  obstacles.push(m);
}
function spawnCollectible(){
  const z=ZONE();
  const geo=new THREE.SphereGeometry(.5,8,8);
  const mat=new THREE.MeshLambertMaterial({color:0x00F0FF});
  const m=new THREE.Mesh(geo,mat);
  m.position.set(LANE_XS[Math.floor(Math.random()*5)],.5,player.position.z+80+Math.random()*40);
  scene.add(m);
  collectibles.push({mesh:m,value:10+currentZone*5});
}
function spawnParticle(x,y,z,col){
  if(particles.length>80)return;
  const geo=new THREE.SphereGeometry(.15,4,4);
  const mat=new THREE.MeshBasicMaterial({color:col});
  const m=new THREE.Mesh(geo,mat);
  m.position.set(x,y,z);
  scene.add(m);
  particles.push({mesh:m,vel:{x:(Math.random()-.5)*4,y:Math.random()*3+1,z:(Math.random()-.5)*4},life:1});
}
function ZONE(){return ZONES[Math.min(currentZone,ZONES.length-1)];}

// ─── PHYSICS / UPDATE ────────────────────────────────────────────────────────
const PLAYER_SPEED=18;
const BOOST_MUL=1.8;
const LANE_W=10;

function update(dt){
  if(!running||paused)return;
  frameCount++;

  const z=ZONE();
  const fwdSpeed=z.speed*(boostHeld&&boostCooldown<=0?BOOST_MUL:1);

  // Move player forward
  player.position.z+=fwdSpeed*dt;
  distance+=fwdSpeed*dt;

  // Lateral input
  let lx=0;
  if(keys['ArrowLeft']||keys['a'])lx=-1;
  if(keys['ArrowRight']||keys['d'])lx=1;
  if(joyActive)lx=joyDX/50;
  lx=Math.max(-1,Math.min(1,lx));

  playerVel.x+=(lx*PLAYER_SPEED-playerVel.x)*0.18;
  player.position.x+=playerVel.x*dt;
  player.position.x=Math.max(-LANE_W/2,Math.min(LANE_W/2,player.position.x));

  // Camera follow
  camera.position.x+=(player.position.x*.3-camera.position.x)*.12;
  camera.position.z=player.position.z-10;
  camera.lookAt(player.position.x*.2,0,player.position.z+25);

  // Ground recycling
  for(const t of groundTiles){
    if(t.position.z<player.position.z-20)t.position.z+=groundTiles.length*20;
  }

  // Spawn
  spawnTimer+=dt;
  const spawnInterval=1/(z.spawnRate*60);
  while(spawnTimer>spawnInterval){spawnTimer-=spawnInterval;spawnObstacle();if(Math.random()<.5)spawnCollectible();}

  // Obstacles
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    if(o.position.z<player.position.z-30){scene.remove(o);obstacles.splice(i,1);continue;}
    if(invincible<=0&&collides(player,o)){
      scene.remove(o);obstacles.splice(i,1);
      sfxHit();flashScreen('#FF4D6D');
      for(let p=0;p<8;p++)spawnParticle(player.position.x,player.position.y,player.position.z,0xFF4D6D);
      combo=1;comboTimer=0;
      updateComboUI();
      invincible=1.5;
      score=Math.max(0,score-50);
      updateScoreUI();
    }
  }

  // Collectibles
  for(let i=collectibles.length-1;i>=0;i--){
    const c=collectibles[i];
    c.mesh.rotation.y+=dt*2;
    if(c.mesh.position.z<player.position.z-30){scene.remove(c.mesh);collectibles.splice(i,1);continue;}
    if(collectClose(player,c.mesh)){
      scene.remove(c.mesh);collectibles.splice(i,1);
      const pts=c.value*combo;
      score+=pts;maxCombo=Math.max(maxCombo,combo);
      sfxCollect();
      for(let p=0;p<5;p++)spawnParticle(c.mesh.position.x,c.mesh.position.y,c.mesh.position.z,0x00F0FF);
      combo=Math.min(combo+1,16);comboTimer=3;
      updateScoreUI();updateComboUI();
    }
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.mesh.position.x+=p.vel.x*dt;
    p.mesh.position.y+=p.vel.y*dt;
    p.mesh.position.z+=p.vel.z*dt;
    p.vel.y-=9.8*dt;
    p.life-=dt*1.5;
    p.mesh.material.opacity=p.life;
    p.mesh.material.transparent=true;
    if(p.life<=0){scene.remove(p.mesh);particles.splice(i,1);}
  }

  // Combo decay
  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0){combo=1;updateComboUI();}}
  const comboFill=document.getElementById('combo-bar-fill');
  comboFill.style.width=(comboTimer>0?(comboTimer/3)*100:0)+'%';
  if(combo>=4)comboFill.style.background='var(--coral)';
  else if(combo>=2)comboFill.style.background='var(--lime)';
  else comboFill.style.background='var(--lime)';

  // Cooldowns
  if(boostCooldown>0)boostCooldown-=dt;
  if(sampleCooldown>0)sampleCooldown-=dt;
  if(invincible>0)invincible-=dt;
  player.material.opacity=invincible>0?(Math.sin(frameCount*.5)*.4+.6):1;
  player.material.transparent=invincible>0;

  // Zone progress
  zoneProgress+=fwdSpeed*dt;
  const zoneLen=500+currentZone*200;
  if(zoneProgress>zoneLen){
    zoneProgress=0;
    currentZone=Math.min(currentZone+1,ZONES.length-1);
    zonesCleared++;
    scene.fog.color.setHex(ZONE().fog);
    updateZoneUI();
    sfxZone();flashScreen(ZONE().color);
    showNarrative();
  }

  // Sample action
  if(sampleHeld&&sampleCooldown<=0){
    sampleCooldown=8;
    score+=combo*20;
    updateScoreUI();
    sfxCollect();
    for(let p=0;p<6;p++)spawnParticle(player.position.x,player.position.y,player.position.z,0xBF5FFF);
    showToast('+SYNC BONUS');
  }

  // Score update
  score+=fwdSpeed*dt*combo*.05;
  if(frameCount%6===0)updateScoreUI();

  // Mini-map
  if(frameCount%3===0)drawMiniMap();

  document.getElementById('score-dis').textContent='DIS '+Math.floor(distance)+'m';
}

function collides(a,b){
  const dx=Math.abs(a.position.x-b.position.x);
  const dz=Math.abs(a.position.z-b.position.z);
  return dx<1.4&&dz<1.8;
}
function collectClose(a,b){
  const dx=Math.abs(a.position.x-b.position.x);
  const dz=Math.abs(a.position.z-b.position.z);
  return dx<1.8&&dz<1.8;
}

// ─── UI HELPERS ───────────────────────────────────────────────────────────────
function updateScoreUI(){
  document.getElementById('score-pts').textContent=Math.floor(score);
}
function updateComboUI(){
  document.getElementById('score-combo').textContent='x'+combo;
}
function updateZoneUI(){
  const z=ZONE();
  const zoneEl=document.getElementById('zone-label');
  zoneEl.textContent=z.name;
  zoneEl.style.color='#'+z.color.toString(16).padStart(6,'0');
}
function flashScreen(hex){
  const c=typeof hex==='number'?'#'+hex.toString(16).padStart(6,'0'):hex;
  const el=document.getElementById('zone-flash');
  el.style.background=c;
  el.style.opacity='.35';
  setTimeout(()=>el.style.opacity='0',180);
}
let narrativeTimer=0,narrativeInterval=null;
function showNarrative(){
  const lines=NARRATIVES[Math.min(currentZone,NARRATIVES.length-1)];
  const el=document.getElementById('narrative');
  const txt=document.getElementById('narrative-text');
  const sub=document.getElementById('narrative-sub');
  let idx=0;
  clearInterval(narrativeInterval);
  const show=()=>{
    if(idx>=lines.length){el.style.opacity='0';return;}
    txt.textContent=lines[idx++];
    sub.textContent=ZONE().name;
    el.style.opacity='1';
    setTimeout(()=>el.style.opacity='0',1800);
  };
  show();
  narrativeInterval=setInterval(()=>{if(!running||paused){clearInterval(narrativeInterval);return;}show();},2600);
}
let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.opacity='1';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.style.opacity='0',1200);
}

// ─── MINI-MAP ─────────────────────────────────────────────────────────────────
function drawMiniMap(){
  if(!miniCtx)return;
  const mw=miniCtx.canvas.width,mh=miniCtx.canvas.height;
  miniCtx.fillStyle='rgba(6,9,22,.85)';
  miniCtx.fillRect(0,0,mw,mh);
  const viewRange=80;
  const toMX=x=>mw/2+(x/LANE_W)*(mw/2);
  const toMY=z=>mh-((z-player.position.z+5)/viewRange)*mh;
  // obstacles
  miniCtx.fillStyle='#FF4D6D';
  for(const o of obstacles){
    const mx=toMX(o.position.x),my=toMY(o.position.z);
    if(my<0||my>mh)continue;
    miniCtx.fillRect(mx-2,my-2,5,5);
  }
  // collectibles
  miniCtx.fillStyle='#00F0FF';
  for(const c of collectibles){
    const mx=toMX(c.mesh.position.x),my=toMY(c.mesh.position.z);
    if(my<0||my>mh)continue;
    miniCtx.fillRect(mx-1,my-1,3,3);
  }
  // player
  miniCtx.fillStyle='#C8F500';
  miniCtx.fillRect(toMX(player.position.x)-3,mh-8,7,7);
}

// ─── GAME LOOP ────────────────────────────────────────────────────────────────
let lastT=0;
function loop(t){
  animId=requestAnimationFrame(loop);
  const dt=Math.min((t-lastT)/1000,.05);
  lastT=t;
  update(dt);
  renderer.render(scene,camera);
}

// ─── GAME CONTROL ────────────────────────────────────────────────────────────
function startGame(){
  unlockAudio();
  resetGame();
  showScreen('screen-game');
  running=true;paused=false;
  lastT=performance.now();
  if(animId)cancelAnimationFrame(animId);
  animId=requestAnimationFrame(loop);
  updateZoneUI();
  setTimeout(showNarrative,600);
}
function resetGame(){
  score=0;combo=1;comboTimer=0;maxCombo=1;distance=0;zonesCleared=0;
  currentZone=0;zoneProgress=0;frameCount=0;spawnTimer=0;
  boostCooldown=0;sampleCooldown=0;invincible=0;
  playerVel={x:0,z:0};
  if(player)player.position.set(0,.5,0);
  [...obstacles].forEach(o=>scene.remove(o));obstacles=[];
  [...collectibles].forEach(c=>scene.remove(c.mesh));collectibles=[];
  [...particles].forEach(p=>scene.remove(p.mesh));particles=[];
  scene.fog.color.setHex(ZONES[0].fog);
  updateScoreUI();updateComboUI();updateZoneUI();
  document.getElementById('score-dis').textContent='DIS 0m';
  document.getElementById('narrative').style.opacity='0';
  document.getElementById('toast').style.opacity='0';
  document.getElementById('combo-bar-fill').style.width='0%';
  joyActive=false;joyDX=0;joyDY=0;boostHeld=false;sampleHeld=false;
  document.getElementById('joystick-base').style.display='none';
  document.getElementById('joystick-stick').style.display='none';
  document.getElementById('btn-boost').classList.remove('active');
  document.getElementById('btn-sample').classList.remove('active');
}
function endGame(){
  running=false;
  if(animId)cancelAnimationFrame(animId);
  clearInterval(narrativeInterval);
  const finalScore=Math.floor(score);
  if(finalScore>sessionBest){sessionBest=finalScore;}
  if(finalScore>(parseInt(localStorage.getItem('bs26_best'))||0)){
    localStorage.setItem('bs26_best',finalScore);
  }
  document.getElementById('over-score').textContent=finalScore;
  document.getElementById('over-dis').textContent=Math.floor(distance)+'m';
  document.getElementById('over-combo').textContent='x'+maxCombo;
  document.getElementById('over-zones').textContent=zonesCleared;
  if(localName)document.getElementById('name-input').value=localName;
  showScreen('screen-over');
}
function pauseGame(){
  if(!running)return;
  paused=true;
  showScreen('screen-pause');
}
function resumeGame(){
  paused=false;
  showScreen('screen-game');
  lastT=performance.now();
}

// ─── SCREENS ─────────────────────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ─── LEADERBOARD ─────────────────────────────────────────────────────────────
async function loadBoot(){
  const best=localStorage.getItem('bs26_best')||'–';
  document.getElementById('boot-hs').textContent=best!='–'?parseInt(best).toLocaleString():best;
  try{
    const{data,error}=await sb.from('brainshred26').select('score,player_name',{count:'exact'}).order('score',{ascending:false}).limit(200);
    if(!error&&data){
      document.getElementById('boot-plays').textContent=data.length;
      const myName=localName;
      const myBest=parseInt(localStorage.getItem('bs26_best'))||0;
      if(myBest>0&&myName){
        const rank=data.filter(r=>r.score>myBest).length+1;
        document.getElementById('boot-rank').textContent='#'+rank;
      }
    }
  }catch(e){}
  document.getElementById('loading-bar').style.width='100%';
}
async function submitScore(name,pts){
  if(!name.trim()||pts<=0)return;
  localName=name.trim().toUpperCase();
  localStorage.setItem('bs26_name',localName);
  try{
    await sb.from('brainshred26').insert({player_name:localName,score:pts,max_combo:maxCombo,distance_m:Math.floor(distance),zones_cleared:zonesCleared});
  }catch(e){}
}
async function loadBoard(highlightName=''){
  const list=document.getElementById('board-list');
  list.innerHTML='<div style="opacity:.4;font-size:12px;padding:8px;">LOADING...</div>';
  try{
    const{data,error}=await sb.from('brainshred26').select('player_name,score').order('score',{ascending:false}).limit(20);
    if(error||!data){list.innerHTML='<div style="opacity:.4;">NO DATA</div>';return;}
    list.innerHTML='';
    data.forEach((r,i)=>{
      const row=document.createElement('div');
      row.className='board-row'+(r.player_name===highlightName?' me':'');
      row.innerHTML=`<span class="board-rank">${i+1}</span><span class="board-name">${r.player_name||'ANON'}</span><span class="board-score">${Math.floor(r.score).toLocaleString()}</span>`;
      list.appendChild(row);
    });
  }catch(e){list.innerHTML='<div style="opacity:.4;">OFFLINE</div>';}
}

// ─── RESIZE ───────────────────────────────────────────────────────────────────
function onResize(){
  W=window.innerWidth;H=window.innerHeight;
  if(renderer){renderer.setSize(W,H);camera.aspect=W/H;camera.updateProjectionMatrix();}
  // Resize mini-map
  const mc=document.getElementById('mini-map');
  if(miniCtx){
    const r=mc.getBoundingClientRect();
    mc.width=r.width||72;mc.height=r.height||72;
  }
}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',()=>setTimeout(onResize,120));

// ─── KEYBOARD ────────────────────────────────────────────────────────────────
document.addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '&&running&&!paused){boostHeld=true;document.getElementById('btn-boost').classList.add('active');}});
document.addEventListener('keyup',e=>{keys[e.key]=false;if(e.key===' '){boostHeld=false;document.getElementById('btn-boost').classList.remove('active');}});

// ─── JOYSTICK ────────────────────────────────────────────────────────────────
const jZone=document.getElementById('joystick-zone');
const jBase=document.getElementById('joystick-base');
const jStick=document.getElementById('joystick-stick');
const JOY_R=Math.min(W,H)*.09;

function joyStart(x,y){
  if(!running||paused)return;
  unlockAudio();
  joyActive=true;
  joyStartX=x;joyStartY=y;
  jBase.style.left=x+'px';jBase.style.top=y+'px';
  jBase.style.display='block';
  jStick.style.left=x+'px';jStick.style.top=y+'px';
  jStick.style.display='block';
}
function joyMove(x,y){
  if(!joyActive)return;
  const dx=x-joyStartX,dy=y-joyStartY;
  const dist=Math.sqrt(dx*dx+dy*dy);
  const cDist=Math.min(dist,JOY_R);
  const angle=Math.atan2(dy,dx);
  joyDX=Math.cos(angle)*cDist;
  joyDY=Math.sin(angle)*cDist;
  jStick.style.left=(joyStartX+joyDX)+'px';
  jStick.style.top=(joyStartY+joyDY)+'px';
}
function joyReset(){
  joyActive=false;joyDX=0;joyDY=0;
  jBase.style.display='none';
  jStick.style.display='none';
}

jZone.addEventListener('touchstart',e=>{
  e.preventDefault();
  unlockAudio();
  const t=e.changedTouches[0];
  joyStart(t.clientX,t.clientY);
},{passive:false});
jZone.addEventListener('touchmove',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  joyMove(t.clientX,t.clientY);
},{passive:false});
jZone.addEventListener('touchend',e=>{
  e.preventDefault();
  joyReset();
},{passive:false});

// ─── ACTION BUTTONS ───────────────────────────────────────────────────────────
const btnBoost=document.getElementById('btn-boost');
const btnSample=document.getElementById('btn-sample');

btnBoost.addEventListener('touchstart',e=>{e.preventDefault();unlockAudio();if(boostCooldown<=0){boostHeld=true;boostCooldown=4;sfxBoost();}btnBoost.classList.add('active');},{passive:false});
btnBoost.addEventListener('touchend',e=>{e.preventDefault();boostHeld=false;btnBoost.classList.remove('active');},{passive:false});
btnBoost.addEventListener('mousedown',()=>{if(boostCooldown<=0){boostHeld=true;boostCooldown=4;sfxBoost();}btnBoost.classList.add('active');});
btnBoost.addEventListener('mouseup',()=>{boostHeld=false;btnBoost.classList.remove('active');});

btnSample.addEventListener('touchstart',e=>{e.preventDefault();unlockAudio();sampleHeld=true;btnSample.classList.add('active');},{passive:false});
btnSample.addEventListener('touchend',e=>{e.preventDefault();sampleHeld=false;btnSample.classList.remove('active');},{passive:false});
btnSample.addEventListener('mousedown',()=>{sampleHeld=true;btnSample.classList.add('active');});
btnSample.addEventListener('mouseup',()=>{sampleHeld=false;btnSample.classList.remove('active');});

// ─── SCREEN BUTTONS ───────────────────────────────────────────────────────────
document.getElementById('btn-play').addEventListener('click',()=>{unlockAudio();startGame();});
document.getElementById('btn-board-boot').addEventListener('click',()=>{unlockAudio();loadBoard();showScreen('screen-board');});
document.getElementById('btn-pause').addEventListener('click',()=>{unlockAudio();pauseGame();});
document.getElementById('btn-resume').addEventListener('click',()=>resumeGame());
document.getElementById('btn-quit').addEventListener('click',()=>{running=false;if(animId)cancelAnimationFrame(animId);showScreen('screen-boot');loadBoot();});
document.getElementById('btn-retry').addEventListener('click',()=>{unlockAudio();startGame();});
document.getElementById('btn-board-over').addEventListener('click',()=>{loadBoard(localName);showScreen('screen-board');});
document.getElementById('btn-play-board').addEventListener('click',()=>{unlockAudio();startGame();});
document.getElementById('btn-back-board').addEventListener('click',()=>showScreen(running?'screen-game':'screen-boot'));
document.getElementById('btn-submit').addEventListener('click',async()=>{
  const n=document.getElementById('name-input').value.trim();
  if(!n){showToast('ENTER YOUR NAME');return;}
  const s=Math.floor(score);
  await submitScore(n,s);
  showToast('SCORE SAVED!');
  document.getElementById('btn-submit').disabled=true;
  loadBoot();
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
initThree();
loadBoot();

// Unlock audio on any interaction
['touchstart','mousedown','keydown'].forEach(ev=>{
  document.addEventListener(ev, unlockAudio, {once:false, passive:true});
});

// Prevent default scroll/zoom on game screen
document.addEventListener('touchmove',e=>{
  if(document.getElementById('screen-game').classList.contains('active')){
    e.preventDefault();
  }
},{passive:false});

document.addEventListener('touchstart',e=>{
  if(document.getElementById('screen-game').classList.contains('active')){
    // Track all touches for joystick release
    for(const t of e.changedTouches){
      if(joyActive&&t.identifier===undefined)joyReset();
    }
  }
},{passive:false});

// Handle multi-touch joystick release
document.addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(joyActive) { joyReset(); break; }
  }
}, {passive: false});
})();

})();
</script>
